name: Bug report
description: Report something broken in Appling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search [Appling issues](https://github.com/ub1979/appling/issues) first.
        Do not post API keys, private project files, raw `.lyra/` state, or unreviewed logs.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Appling with ./start.sh
        2. Create or open a project...
        3. Do...
        4. See...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or startup
        - Project setup or templates
        - Chat, agents, or approvals
        - Build, preview, or QA
        - Model connection or settings
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Appling version
      description: Shown in the Appling home screen, if the app starts.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error or screenshot (optional)
      description: Include only the lines needed to understand the failure. Remove secrets and personal or customer data first.
