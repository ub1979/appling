name: Feature request
description: Suggest an improvement to Appling.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search [Appling issues](https://github.com/ub1979/appling/issues) for a similar idea before posting.
  - type: textarea
    id: outcome
    attributes:
      label: What are you trying to achieve?
      description: Describe the project or task and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What have you tried?
      description: Explain the current Appling behavior or workaround, if any.
  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement (optional)
      description: A proposed UI or behavior is helpful, but the user problem is most important.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Apps or websites
        - Slides or videos
        - Templates or design
        - Agents or workflow
        - Models or settings
        - Developer experience
        - Other
