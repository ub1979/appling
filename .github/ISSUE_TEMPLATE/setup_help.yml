name: Setup help
description: Ask for help installing Appling or connecting a model.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [Appling quick start](https://github.com/ub1979/appling#quick-start).
        Do not post API keys, configuration files, private project data, or raw diagnostic uploads.
  - type: textarea
    id: problem
    attributes:
      label: Where did setup stop?
      description: Say which instruction you reached and what happened.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands or steps tried
      placeholder: |
        1. git clone https://github.com/ub1979/appling.git
        2. cd appling
        3. ./start.sh
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Appling version (if available)
      description: Shown on the home screen.
  - type: textarea
    id: error
    attributes:
      label: Redacted error message
      description: Copy only relevant lines after removing secrets and personal or customer data.
