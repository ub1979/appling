name: Appling installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'appling-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac
            artifact: '*.dmg'
          - runner: windows-2022
            target: win
            artifact: '*.exe'
          - runner: ubuntu-24.04
            target: linux
            artifact: '*.AppImage'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - name: Build Appling UI
        working-directory: lyra_lite/ui
        run: npm ci && npm run build
      - name: Install desktop build dependencies
        working-directory: apps/appling-desktop
        run: npm ci --workspaces=false
      - name: Build installer
        working-directory: apps/appling-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:${{ matrix.target }}
      - name: Smoke test packaged runtime
        working-directory: apps/appling-desktop
        run: npm run smoke
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appling-${{ matrix.target }}
          path: apps/appling-desktop/release/${{ matrix.artifact }}
          if-no-files-found: error
