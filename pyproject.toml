[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appling_c"
version = "0.1.0"
description = "A guided, local app studio with durable project memory and interchangeable AI engines"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
appling-c = "appling.__main__:main"

[tool.setuptools]
packages = ["appling", "appling.engines"]

[tool.setuptools.package-data]
appling = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
